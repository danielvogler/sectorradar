---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        # Network- and money-spending tests are deselected: CI has no API keys
        # and must never depend on a third party being up.
        # The coverage floor lives in pyproject, where its precision can be set:
        # `--cov-fail-under` compares the rounded figure, so at the default
        # precision of 0 a run at 79.68% printed FAIL and exited 0.
        run: >-
          uv run pytest -m "not network and not llm"
          --cov --cov-report=term-missing

  web:
    name: front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm exec astro check

      # The build is the point of this job. `make check` skips `astro check`
      # without node_modules so it can pass from a bare clone, which left the
      # front end type-checked on developer machines and nowhere else — and a
      # build from a clean checkout is the only thing that catches a source
      # file that was never committed. One was: `web/src/lib/app.ts`, the
      # entire client runtime, for the life of the project.
      - name: Build from a clean checkout
        working-directory: web
        run: pnpm build

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret committed once and reverted is still leaked.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: No collected data is tracked
        run: |
          if [ -n "$(git ls-files data/)" ]; then
            echo "::error::files under data/ are tracked by git — see DATA.md"
            git ls-files data/
            exit 1
          fi

      - name: No AI co-author trailers in history
        run: |
          if git log --format='%B' | grep -i 'co-authored-by'; then
            echo "::error::an AI Co-Authored-By trailer is present in the history"
            exit 1
          fi
