<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96" role="img" aria-label="sectorradar">
  <title>sectorradar</title>
  <!-- The app's wordmark, set rather than drawn: two weights of one family
       with no gap, and the accent carried by a single dot. Two variants
       because GitHub renders README images against either theme. -->
  <text x="0" y="66"
        font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="64" letter-spacing="-2.9">
    <tspan fill="#FDFDFB" font-weight="700">sector</tspan><tspan fill="#A3A39D" font-weight="400">radar</tspan>
  </text>
  <circle cx="371" cy="47" r="8.5" fill="#FF000D"/>
</svg>
