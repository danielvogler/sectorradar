    note: "High recall, terrible precision. Candidates only, never auto-include."

# Recall is measured against this list on every run. It is the single most
# important number in the project.
#
# BOOTSTRAPPED BY AGENT — owner must review before any recall figure here is
# quoted to anyone. Two caveats that matter:
#
#   1. These firms were found by web search, which is also one of the pipeline's
#      own discovery channels. A gold set drawn from the same channel it
#      measures inflates recall. The entries below came from a different search
#      engine than the `websearch` source uses, which reduces the overlap but
#      does not eliminate it.
#   2. `expected_tier` is a judgement from a search-result snippet, not from
#      reading each company's site. Treat it as a hint.
#
# The gold set this project actually deserves is the owner's own list of firms
# he has lost pitches to. Until that replaces this, recall is a sanity signal —
# "did discovery collapse" — and not a measurement of coverage.
gold_set:
  # Agentic AI / GenAI services as the primary offering
  - domain: vudu.ch
    expected_tier: 1
  - domain: troisol.ch
